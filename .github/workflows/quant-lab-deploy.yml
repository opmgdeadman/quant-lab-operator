name: Quant Lab Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact commit SHA to validate and deploy
        required: true
        type: string
      mode:
        description: Apply migrations only or deploy after migrations
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - migrations

permissions:
  contents: read

jobs:
  deploy:
    runs-on: macos-15-intel
    steps:
      - name: Validate exact SHA input
        shell: bash
        run: |
          if [[ ! "${{ inputs.deploy_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "deploy_sha must be a 40-character commit SHA"
            exit 1
          fi
          if [[ "${{ inputs.mode }}" != "deploy" && "${{ inputs.mode }}" != "migrations" ]]; then
            echo "mode must be deploy or migrations"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Worker tests
        run: npm test
      - name: Run quant core tests
        run: python -m pytest
      - name: Validate Worker configuration
        run: npm run check
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply quant_lab_operator --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        if: ${{ inputs.mode == 'deploy' }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_SHA: ${{ inputs.deploy_sha }}
          REPOSITORY_SHA: ${{ inputs.deploy_sha }}
          CURRENT_PHASE: autonomous-steady-state
      - name: Verify production console and canonical branding
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const baseUrl = "https://quant-lab-operator.briangriffin355.workers.dev";
          const requiredHomeMarkers = [
            "/quant-lab-logo.png",
            "/site.webmanifest",
            'property="og:image"',
            'name="twitter:card" content="summary"',
          ];
          const requiredAssets = [
            "favicon.ico",
            "favicon-16x16.png",
            "favicon-32x32.png",
            "apple-touch-icon.png",
            "android-chrome-192x192.png",
            "android-chrome-512x512.png",
            "quant-lab-logo.png",
            "og-image.png",
          ];

          async function fetchWithRetry(path, attempts = 12) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(`${baseUrl}${path}`, { redirect: "follow" });
                if (response.ok) return response;
                lastError = new Error(`${path} returned HTTP ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              if (attempt < attempts) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw lastError || new Error(`${path} unavailable`);
          }

          const home = await (await fetchWithRetry("/")).text();
          for (const marker of requiredHomeMarkers) {
            if (!home.includes(marker)) throw new Error(`Production home missing marker: ${marker}`);
          }
          console.log("Production home branding markers passed");

          const manifest = await (await fetchWithRetry("/site.webmanifest")).json();
          if (manifest.name !== "Quant Lab") throw new Error("Manifest name mismatch");
          const iconSizes = new Set((manifest.icons || []).map((icon) => icon.sizes));
          if (!iconSizes.has("192x192") || !iconSizes.has("512x512")) {
            throw new Error("Manifest icon sizes incomplete");
          }
          console.log("Production manifest passed");

          for (const asset of requiredAssets) {
            const response = await fetchWithRetry(`/${asset}`);
            const bytes = new Uint8Array(await response.arrayBuffer());
            if (bytes.byteLength < 100) throw new Error(`${asset} response is unexpectedly small`);
          }
          console.log("Production brand assets passed");

          const status = await (await fetchWithRetry("/api/public/status")).json();
          if (status.ok !== true || status.workerStatus !== "online") {
            throw new Error(`Public status unhealthy: ${JSON.stringify({ ok: status.ok, workerStatus: status.workerStatus })}`);
          }
          console.log("Production public status passed");
          console.log("Production branding smoke verification passed");
          NODE
