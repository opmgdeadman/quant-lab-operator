name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Worker tests
        run: npm test

  forward-diagnostics:
    name: forward-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: policy
            pattern: forward policy is frozen
          - case: no-champion
            pattern: healthy data with no qualified champion
          - case: data-gates
            pattern: ingestion failures
          - case: ema-buy
            pattern: EMA bullish cross
          - case: ema-sell
            pattern: EMA bearish cross
          - case: rsi
            pattern: RSI entries
          - case: hold
            pattern: no signal creates
          - case: invalid
            pattern: invalid champion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run isolated forward test
        run: node --test --test-name-pattern="${{ matrix.pattern }}" test/forward-paper.test.js

  quant-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run quant core tests
        run: python -m pytest

  wrangler-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate Wrangler config
        run: npm run check
