name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: status-response
            files: test/worker.test.js
            pattern: operator mcp status response exists
          - group: status-identity
            files: test/worker.test.js
            pattern: operator mcp status reports system identity
          - group: status-database
            files: test/worker.test.js
            pattern: operator mcp status reports database connectivity
          - group: status-privacy
            files: test/worker.test.js
            pattern: operator mcp status omits private database probe
    name: worker-tests (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ${{ matrix.group }} tests
        if: ${{ matrix.pattern == '' }}
        run: node --test ${{ matrix.files }}
      - name: Run ${{ matrix.group }} patterned tests
        if: ${{ matrix.pattern != '' }}
        run: node --test --test-name-pattern="${{ matrix.pattern }}" ${{ matrix.files }}

  quant-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run quant core tests
        run: python -m pytest

  wrangler-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate Wrangler config
        run: npm run check
