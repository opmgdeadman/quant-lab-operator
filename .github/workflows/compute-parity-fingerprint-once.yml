name: Compute Quant parity fingerprint once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compute-parity-fingerprint-once.yml

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compute exact material fingerprint and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test -s parity/material-manifest-v1.txt
          : > /tmp/quant-material-identities.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            git cat-file -e "HEAD:${path}"
            blob="$(git rev-parse "HEAD:${path}")"
            printf '%s=%s\n' "$path" "$blob" >> /tmp/quant-material-identities.txt
          done < parity/material-manifest-v1.txt
          LC_ALL=C sort -o /tmp/quant-material-identities.txt /tmp/quant-material-identities.txt
          fingerprint="$(sha256sum /tmp/quant-material-identities.txt | awk '{print $1}')"
          printf '%s\n' "$fingerprint" > parity/current-fingerprint.txt
          git rm .github/workflows/compute-parity-fingerprint-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parity/current-fingerprint.txt
          git commit -m 'Record post-migration Quant parity fingerprint'
          git push origin HEAD:main
