name: Quant Lab CI
run-name: Quant Lab CI · ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quant-lab-ci-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit public repository history
        run: node test/public-repository-audit.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Worker public-surface integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="internal status|home renders|canonical Quant Lab brand assets|public live status|professional console|legacy public proof|oauth metadata" test/worker.test.js
      - name: Run Worker MCP protocol integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="operator mcp|operator intents fail|generic intent envelope" test/worker.test.js
      - name: Run direct operator-status integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="direct operator_status" test/worker.test.js
      - name: Run continuation state integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic state" test/worker.test.js
      - name: Run continuation authority integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic authority" test/worker.test.js
      - name: Run continuation identity integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic identity" test/worker.test.js
      - name: Run continuation active-job integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic active job" test/worker.test.js
      - name: Run continuation current-action integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic current action" test/worker.test.js
      - name: Run continuation mutation-boundary integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic mutation boundary" test/worker.test.js
      - name: Run idempotency integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="execute_quant_lab_intent" test/worker.test.js
      - name: Run client-input integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="forbidden public input" test/worker.test.js
      - name: Run validation-boundary integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="run_validation" test/worker.test.js
      - name: Run Worker basic repository-control integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="validate_production_sha|list_github_actions_runs reports|engineering access|repo file list and read|apply_repo_patch_set|create_repo_file" test/worker.test.js
      - name: Run GitHub Actions primary integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="GitHub Actions intents" test/worker.test.js
      - name: Run GitHub Actions diagnostic integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="actions diagnostic" test/worker.test.js
      - name: Run Worker deployment-control integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="deploy_cloudflare_worker" test/worker.test.js
      - name: Run Worker production-commission integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="production" test/worker.test.js
      - name: Run operator capability tests
        if: ${{ always() }}
        run: node --test test/operator-capability-directory.test.js
      - name: Run operator client-safety tests
        if: ${{ always() }}
        run: node --test test/operator-client-safety.test.js
      - name: Run Recovery Worker tests
        if: ${{ always() }}
        run: node --test test/recovery-worker.test.js
      - name: Run research and execution Worker tests
        if: ${{ always() }}
        run: >-
          node --test
          test/baseline-bench.test.js
          test/champion-selection.test.js
          test/directional-backtest.test.js
          test/directional-institutional-research.test.js
          test/directional-main.test.js
          test/directional-research.test.js
          test/directional-shadow.test.js
          test/forward-paper.test.js
          test/historical-bootstrap.test.js
          test/hostile-judge.test.js
          test/live-qualification.test.js
          test/market-data.test.js
          test/paper-ledger.test.js
          test/rolling-research.test.js
          test/strategy-factory.test.js
      - name: Run quant core tests
        if: ${{ always() }}
        run: python -m pytest
      - name: Validate Wrangler config
        if: ${{ always() }}
        run: npm run check
