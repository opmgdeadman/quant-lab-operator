name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: catalog
            pattern: directional catalog
          - group: signals
            pattern: EMA strategy
          - group: long
            pattern: long paper exposure
          - group: short
            pattern: short paper exposure
          - group: flip
            pattern: flipping from long
          - group: over-cap
            pattern: exposure above 1x
    name: worker-tests (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ${{ matrix.group }} test
        run: node --test --test-name-pattern="${{ matrix.pattern }}" test/directional-shadow.test.js

  quant-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run quant core tests
        run: python -m pytest

  wrangler-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate Wrangler config
        run: npm run check
