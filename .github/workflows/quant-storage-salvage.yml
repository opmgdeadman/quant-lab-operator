name: Quant Dormant Storage Salvage

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/quant-storage-salvage.yml"
      - "migrations/0024_dormant_storage_salvage.sql"

permissions:
  contents: write

concurrency:
  group: quant-dormant-storage-salvage
  cancel-in-progress: false

jobs:
  salvage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove Quant is dormant before maintenance
        run: |
          node --test test/quant-dormancy.test.js
          grep -q '"CURRENT_PHASE": "dormant-read-only"' wrangler.jsonc
          if grep -q '"crons"' wrangler.jsonc; then
            echo "Quant cron schedule must remain absent." >&2
            exit 1
          fi

      - name: Capture D1 size before
        run: npx wrangler d1 info quant_lab_operator --json > /tmp/quant-d1-before.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply one-time salvage migration when present
        if: ${{ hashFiles('migrations/0024_dormant_storage_salvage.sql') != '' }}
        run: npx wrangler d1 migrations apply quant_lab_operator --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Capture D1 size after
        run: npx wrangler d1 info quant_lab_operator --json > /tmp/quant-d1-after.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify salvage receipt when migration is present
        if: ${{ hashFiles('migrations/0024_dormant_storage_salvage.sql') != '' }}
        run: |
          npx wrangler d1 execute quant_lab_operator --remote --json --command             "SELECT id, applied_at, mode, retained_market_candles, market_candles_before, market_candles_after, baseline_trades_before, baseline_trades_after, strategy_candidate_runs_before, strategy_candidate_runs_after, strategy_candidate_trades_before, strategy_candidate_trades_after, directional_research_runs_before, directional_research_runs_after, institutional_evidence_before, institutional_evidence_after, external_observations_before, external_observations_after, rows_purged FROM quant_storage_salvage_receipts WHERE id = 'dormant-salvage-20260927';"             > /tmp/quant-salvage-receipt.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy hard-dormant Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_SHA: ${{ github.sha }}
          REPOSITORY_SHA: ${{ github.sha }}

      - name: Verify production health
        run: |
          curl --fail --silent --show-error https://quant-lab-operator.briangriffin355.workers.dev/api/public/status > /tmp/quant-health.json

      - name: Persist storage receipt
        run: |
          node <<'NODE'
          const fs = require("fs");
          const before = JSON.parse(fs.readFileSync("/tmp/quant-d1-before.json", "utf8"));
          const after = JSON.parse(fs.readFileSync("/tmp/quant-d1-after.json", "utf8"));
          function findFileSize(value) {
            if (!value || typeof value !== "object") return null;
            if (Number.isFinite(Number(value.file_size))) return Number(value.file_size);
            if (Array.isArray(value)) {
              for (const item of value) {
                const found = findFileSize(item);
                if (found !== null) return found;
              }
              return null;
            }
            for (const nested of Object.values(value)) {
              const found = findFileSize(nested);
              if (found !== null) return found;
            }
            return null;
          }
          const beforeBytes = findFileSize(before);
          const afterBytes = findFileSize(after);
          if (beforeBytes === null || afterBytes === null) {
            throw new Error("d1_file_size_missing");
          }
          let salvage = null;
          if (fs.existsSync("/tmp/quant-salvage-receipt.json")) {
            salvage = JSON.parse(fs.readFileSync("/tmp/quant-salvage-receipt.json", "utf8"));
          }
          const result = {
            schema_version: "quant-storage-salvage-receipt-v1",
            source_sha: process.env.GITHUB_SHA,
            mode: fs.existsSync("migrations/0024_dormant_storage_salvage.sql") ? "salvage" : "preflight",
            before_bytes: beforeBytes,
            after_bytes: afterBytes,
            bytes_reclaimed: Math.max(0, beforeBytes - afterBytes),
            reduction_percent: beforeBytes > 0 ? Number((((beforeBytes - afterBytes) / beforeBytes) * 100).toFixed(2)) : 0,
            quant_phase: "dormant-read-only",
            migration_present: fs.existsSync("migrations/0024_dormant_storage_salvage.sql"),
            salvage,
            captured_at: new Date().toISOString()
          };
          fs.mkdirSync("validation", { recursive: true });
          fs.writeFileSync("validation/quant-storage-salvage.json", JSON.stringify(result, null, 2) + "\n");
          NODE

      - name: Commit storage receipt
        run: |
          git config user.name "quant-storage-salvage"
          git config user.email "quant-storage-salvage@users.noreply.github.com"
          git add validation/quant-storage-salvage.json
          if git diff --cached --quiet; then
            echo "Storage receipt unchanged."
          else
            git commit -m "Record Quant dormant storage salvage receipt"
            git push origin HEAD:main
          fi
