name: Quant Lab CI
run-name: Quant Lab CI · ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quant-lab-ci-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit public repository history
        run: node test/public-repository-audit.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Worker public-surface integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="internal status|home renders|canonical Quant Lab brand assets|public live status|professional console|legacy public proof|oauth metadata" test/worker.test.js
      - name: Run Worker MCP protocol integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="operator mcp|operator intents fail|generic intent envelope" test/worker.test.js
      - name: Run direct operator-status integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="direct operator_status" test/worker.test.js
      - name: Run continuation state integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic state" test/worker.test.js
      - name: Run continuation authority integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic authority" test/worker.test.js
      - name: Run continuation identity integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic identity" test/worker.test.js
      - name: Run continuation active-job integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic active job" test/worker.test.js
      - name: Run continuation current-action integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic current action" test/worker.test.js
      - name: Run continuation mutation-boundary integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="continuation diagnostic mutation boundary" test/worker.test.js
      - name: Run idempotency integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="execute_quant_lab_intent" test/worker.test.js
      - name: Run client-input integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="forbidden public input" test/worker.test.js
      - name: Run validation-boundary integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="run_validation" test/worker.test.js
      - name: Run Worker basic repository-control integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="validate_production_sha|list_github_actions_runs reports|engineering access|repo file list and read|apply_repo_patch_set|create_repo_file" test/worker.test.js
      - name: Run GitHub Actions primary integration test
        if: ${{ always() }}
        run: node --test --test-name-pattern="GitHub Actions intents" test/worker.test.js
      - name: Run GitHub Actions diagnostic integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="actions diagnostic" test/worker.test.js
      - name: Run Worker deployment-control integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="deploy_cloudflare_worker" test/worker.test.js
      - name: Run Worker production-commission integration tests
        if: ${{ always() }}
        run: node --test --test-name-pattern="production" test/worker.test.js
      - name: Run operator capability tests
        if: ${{ always() }}
        run: node --test test/operator-capability-directory.test.js
      - name: Run operator client-safety tests
        if: ${{ always() }}
        run: node --test test/operator-client-safety.test.js
      - name: Run Recovery Worker tests
        if: ${{ always() }}
        run: node --test test/recovery-worker.test.js
      - name: Run baseline bench tests
        if: ${{ always() }}
        run: node --test test/baseline-bench.test.js
      - name: Run champion selection tests
        if: ${{ always() }}
        run: node --test test/champion-selection.test.js
      - name: Run directional backtest tests
        if: ${{ always() }}
        run: node --test test/directional-backtest.test.js
      - name: Run directional institutional research tests
        if: ${{ always() }}
        run: node --test test/directional-institutional-research.test.js
      - name: Run directional main tests
        if: ${{ always() }}
        run: node --test test/directional-main.test.js
      - name: Run directional research tests
        if: ${{ always() }}
        run: node --test test/directional-research.test.js
      - name: Run directional shadow tests
        if: ${{ always() }}
        run: node --test test/directional-shadow.test.js
      - name: Run forward paper tests
        if: ${{ always() }}
        run: node --test test/forward-paper.test.js
      - name: Run historical bootstrap tests
        if: ${{ always() }}
        run: node --test test/historical-bootstrap.test.js
      - name: Run hostile judge tests
        if: ${{ always() }}
        run: node --test test/hostile-judge.test.js
      - name: Run institutional research portfolio tests
        if: ${{ always() }}
        run: node --test test/institutional-research-portfolio.test.js
      - name: Run institutional research evaluation tests
        if: ${{ always() }}
        run: node --test test/institutional-research-evaluation.test.js
      - name: Run live qualification tests
        if: ${{ always() }}
        run: node --test test/live-qualification.test.js
      - name: Run market data tests
        if: ${{ always() }}
        run: node --test test/market-data.test.js
      - name: Run paper ledger tests
        if: ${{ always() }}
        run: node --test test/paper-ledger.test.js
      - name: Run rolling research tests
        if: ${{ always() }}
        run: node --test test/rolling-research.test.js
      - name: Run strategy factory tests
        if: ${{ always() }}
        run: node --test test/strategy-factory.test.js
      - name: Run quant core tests
        if: ${{ always() }}
        run: python -m pytest
      - name: Validate Wrangler config
        if: ${{ always() }}
        run: npm run check

  fleet_timing_package_retrofit:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Quant Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Quant Lab timing retrofit config
        run: |
          cat > /tmp/quant-lab-timing.json <<'JSON'
          {
            "schema_version": "fleet-timing-telemetry-retrofit-config-v1",
            "inventory_id": "quant-lab",
            "mcp_name": "quant-lab",
            "repository": {"account":"opmgdeadman","name":"quant-lab-operator","branch":"main"},
            "runtime": {"entrypoint":"src/index.js","telemetry_binding":"TELEMETRY_DB"},
            "central_store": "mcp-controller-audit",
            "raw_retention_days": 7,
            "integration": {
              "core_target": "standards/fleet-timing-telemetry-v1.mjs",
              "config_target": "standards/fleet-timing-telemetry-config-v1.mjs",
              "retrofit_manifest": "standards/timing-telemetry-v1/retrofit.json",
              "patches": []
            },
            "certification": {
              "adapter_module": "src/operator/fleetTelemetry.js",
              "certification_record": "benchmarks/certifications/quant-lab-fleet-timing-telemetry-v1.json",
              "compliance_record": "inventory/compliance/quant-lab.json",
              "probe": {
                "first": {"tool_name":"get_quant_lab_startup_context","arguments":{}},
                "second": {"tool_name":"get_quant_lab_status","arguments":{}}
              }
            }
          }
          JSON
      - name: Run package Timing Telemetry installer
        run: node .controller/benchmarks/standards/retrofits/fleet-standards-v1/timing-install-v1.js --config /tmp/quant-lab-timing.json --target . --controller-root .controller
      - name: Verify Quant Lab tests after package install
        run: |
          npm ci
          npm test
      - name: Commit package-managed timing artifacts
        run: |
          git config user.name "quant-lab-operator"
          git config user.email "quant-lab-operator@users.noreply.github.com"
          git add standards/fleet-timing-telemetry-v1.mjs standards/fleet-timing-telemetry-config-v1.mjs standards/timing-telemetry-v1/retrofit.json
          if git diff --cached --quiet; then
            echo "Package timing retrofit already installed."
          else
            git commit -m "Install fleet Timing Telemetry package artifacts"
            git push origin HEAD:main
          fi
