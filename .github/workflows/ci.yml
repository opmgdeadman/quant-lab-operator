name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Diagnose worker console tests
        continue-on-error: true
        run: node --test test/worker.test.js
      - name: Diagnose directional shadow tests
        continue-on-error: true
        run: node --test test/directional-shadow.test.js
      - name: Diagnose historical bootstrap tests
        continue-on-error: true
        run: node --test test/historical-bootstrap.test.js
      - name: Diagnose operator directory tests
        continue-on-error: true
        run: node --test test/operator-capability-directory.test.js test/operator-client-safety.test.js
      - name: Diagnose market and paper ledger tests
        continue-on-error: true
        run: node --test test/market-data.test.js test/paper-ledger.test.js
      - name: Diagnose historical research tests
        continue-on-error: true
        run: node --test test/baseline-bench.test.js test/hostile-judge.test.js test/strategy-factory.test.js test/champion-selection.test.js
      - name: Diagnose forward and qualification tests
        continue-on-error: true
        run: node --test test/forward-paper.test.js test/live-qualification.test.js test/rolling-research.test.js
      - name: Run Worker tests
        run: npm test

  quant-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run quant core tests
        run: python -m pytest

  wrangler-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate Wrangler config
        run: npm run check
