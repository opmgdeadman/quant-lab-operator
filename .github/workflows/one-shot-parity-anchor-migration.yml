name: One-shot Quant Lab parity anchor migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-parity-anchor-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace mutable parity authority and self-remove
        shell: bash
        run: |
          set -euo pipefail
          target='.github/workflows/quant-lab-deploy.yml'
          old='/M-BRAIN/PROJECTS/QUANT_LAB/01_STATE.md'
          new='/M-BRAIN/PARITY/quant-lab.md'
          count="$(grep -F -o "$old" "$target" | wc -l | tr -d ' ')"
          test "$count" = '1'
          sed -i "s|$old|$new|g" "$target"
          test "$(grep -F -o "$new" "$target" | wc -l | tr -d ' ')" = '1'
          git rm .github/workflows/one-shot-parity-anchor-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Migrate Quant Lab parity gate to stable anchor'
          git push origin HEAD:main

