name: Quant Lab Deploy
run-name: Quant Lab ${{ inputs.mode }} · ${{ inputs.deploy_sha }}

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact commit SHA to validate and deploy
        required: true
        type: string
      mode:
        description: Apply migrations only or deploy after migrations
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - migrations

permissions:
  contents: read
  actions: write

concurrency:
  group: quant-lab-production-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact SHA input
        shell: bash
        run: |
          if [[ ! "${{ inputs.deploy_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "deploy_sha must be a 40-character commit SHA"
            exit 1
          fi
          if [[ "${{ inputs.mode }}" != "deploy" && "${{ inputs.mode }}" != "migrations" ]]; then
            echo "mode must be deploy or migrations"
            exit 1
          fi
      - name: Checkout exact release head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha }}
          fetch-depth: 0
      - name: Verify exact release identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.deploy_sha }}"
      - name: Audit provider category - GitHub legacy token
        env:
          AUDIT_CATEGORIES: github_legacy_token
        run: node test/public-repository-audit.mjs
      - name: Audit provider category - GitHub fine-grained token
        env:
          AUDIT_CATEGORIES: github_fine_grained_token
        run: node test/public-repository-audit.mjs
      - name: Audit provider category - OpenAI secret key
        env:
          AUDIT_CATEGORIES: openai_secret_key
        run: node test/public-repository-audit.mjs
      - name: Audit provider category - Stripe live secret
        env:
          AUDIT_CATEGORIES: stripe_live_secret
        run: node test/public-repository-audit.mjs
      - name: Audit provider category - AWS access key
        env:
          AUDIT_CATEGORIES: aws_access_key
        run: node test/public-repository-audit.mjs
      - name: Audit provider category - Slack token
        env:
          AUDIT_CATEGORIES: slack_token
        run: node test/public-repository-audit.mjs
      - name: Audit provider category - private key marker
        env:
          AUDIT_CATEGORIES: private_key
        run: node test/public-repository-audit.mjs
      - name: Audit provider category - credentialed URL
        env:
          AUDIT_CATEGORIES: credentialed_url
        run: node test/public-repository-audit.mjs
      - name: Audit category group - sensitive files
        env:
          AUDIT_CATEGORIES: dotenv_file,cloudflare_local_secrets,private_key_file,ssh_private_key,credential_bundle
        run: node test/public-repository-audit.mjs
      - name: Audit assignment file - worker tests
        env:
          AUDIT_CATEGORIES: literal_secret_assignment
          AUDIT_PATH_PREFIXES: test/worker.test.js
        run: node test/public-repository-audit.mjs
      - name: Audit assignment file - recovery tests
        env:
          AUDIT_CATEGORIES: literal_secret_assignment
          AUDIT_PATH_PREFIXES: test/recovery-worker.test.js
        run: node test/public-repository-audit.mjs
      - name: Audit assignment file - client safety tests
        env:
          AUDIT_CATEGORIES: literal_secret_assignment
          AUDIT_PATH_PREFIXES: test/operator-client-safety.test.js
        run: node test/public-repository-audit.mjs
      - name: Audit assignment file - capability tests
        env:
          AUDIT_CATEGORIES: literal_secret_assignment
          AUDIT_PATH_PREFIXES: test/operator-capability-directory.test.js
        run: node test/public-repository-audit.mjs
      - name: Audit generic assignment path - remaining tests
        env:
          AUDIT_CATEGORIES: literal_secret_assignment
          AUDIT_PATH_PREFIXES: test/
        run: node test/public-repository-audit.mjs
      - name: Audit generic assignment path - source
        env:
          AUDIT_CATEGORIES: literal_secret_assignment
          AUDIT_PATH_PREFIXES: src/
        run: node test/public-repository-audit.mjs
      - name: Audit generic assignment path - docs
        env:
          AUDIT_CATEGORIES: literal_secret_assignment
          AUDIT_PATH_PREFIXES: docs/
        run: node test/public-repository-audit.mjs
      - name: Audit generic assignment path - workflows
        env:
          AUDIT_CATEGORIES: literal_secret_assignment
          AUDIT_PATH_PREFIXES: .github/
        run: node test/public-repository-audit.mjs
      - name: Audit generic assignment path - root config
        env:
          AUDIT_CATEGORIES: literal_secret_assignment
          AUDIT_PATH_PREFIXES: README.md,OPERATING_MEMORY.md,package.json,wrangler.jsonc
        run: node test/public-repository-audit.mjs
      - name: Audit category group - current privacy metadata
        env:
          AUDIT_CATEGORIES: personal_windows_home_path,private_chatgpt_connector_id,local_codex_project_id,local_codex_profile_path
        run: node test/public-repository-audit.mjs
      - name: Audit public repository history
        run: node test/public-repository-audit.mjs
      - name: Reuse successful exact-SHA CI evidence
        id: validation_evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=50" > /tmp/quant-lab-ci-runs.json
          validated_run_id="$(jq -r --arg sha "${RELEASE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | sort_by(.id) | last | .id // empty' /tmp/quant-lab-ci-runs.json)"
          if [[ -n "${validated_run_id}" ]]; then
            echo "reuse=true" >> "${GITHUB_OUTPUT}"
            echo "validated_run_id=${validated_run_id}" >> "${GITHUB_OUTPUT}"
            echo "Reusing successful CI run ${validated_run_id} for ${RELEASE_SHA}."
          else
            echo "reuse=false" >> "${GITHUB_OUTPUT}"
            echo "No successful exact-SHA CI evidence found; running complete fallback validation."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        if: steps.validation_evidence.outputs.reuse != 'true'
        with:
          python-version: "3.13"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: python -m pip install -r requirements.txt
      - name: Test operator capability directory
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test test/operator-capability-directory.test.js
      - name: Test operator client safety
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test test/operator-client-safety.test.js
      - name: Test Recovery Worker
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test test/recovery-worker.test.js
      - name: Test Worker public console surface
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="internal status|home renders|brand assets|public live status|professional console|legacy public" test/worker.test.js
      - name: Test Worker MCP auth and session surface
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="operator mcp|operator intents|generic intent" test/worker.test.js
      - name: Test direct operator status
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="direct operator_status" test/worker.test.js
      - name: Test continuation diagnostic state
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="continuation diagnostic state" test/worker.test.js
      - name: Test continuation diagnostic authority
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="continuation diagnostic authority" test/worker.test.js
      - name: Test continuation diagnostic identity
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="continuation diagnostic identity" test/worker.test.js
      - name: Test continuation diagnostic active job
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="continuation diagnostic active job" test/worker.test.js
      - name: Test continuation diagnostic current action
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="continuation diagnostic current action" test/worker.test.js
      - name: Test continuation diagnostic mutation boundary
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="continuation diagnostic mutation boundary" test/worker.test.js
      - name: Test direct intent replay
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="execute_quant_lab_intent replays" test/worker.test.js
      - name: Test forbidden public input rejection
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="forbidden public" test/worker.test.js
      - name: Test bounded validation response
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="run_validation" test/worker.test.js
      - name: Test production market commissioning adapter
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="production market" test/worker.test.js
      - name: Test production SHA validation
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="validate_production" test/worker.test.js
      - name: Test Actions missing-token response
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="list_github_actions_runs reports missing server-side token" test/worker.test.js
      - name: Test engineering access state
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="engineering access state reports bounded controls" test/worker.test.js
      - name: Test bounded repository list and read
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="repo file list and read use bounded GitHub contents API paths" test/worker.test.js
      - name: Test bounded repository patch dry run
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="apply_repo_patch_set dry-runs exact replacements" test/worker.test.js
      - name: Test bounded repository create and delete
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="create_repo_file and delete_repo_file use one bounded Git data commit" test/worker.test.js
      - name: Test Actions list result
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="actions diagnostic list result" test/worker.test.js
      - name: Test Actions dispatch execution
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="actions diagnostic dispatch execution succeeds" test/worker.test.js
      - name: Test Actions dispatch status
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="actions diagnostic dispatch status" test/worker.test.js
      - name: Test Actions dispatch run identity
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="actions diagnostic dispatch run identity" test/worker.test.js
      - name: Test Actions monitor result
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="actions diagnostic monitor result" test/worker.test.js
      - name: Test Actions authorization headers
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="actions diagnostic authorization headers" test/worker.test.js
      - name: Test Actions response redaction
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="actions diagnostic response redaction" test/worker.test.js
      - name: Test Actions dispatch request shape
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="actions diagnostic dispatch request shape" test/worker.test.js
      - name: Test exact-SHA deployment dispatch controls
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="deploy_cloudflare_worker and apply_d1_migrations dispatch fixed workflow" test/worker.test.js
      - name: Test Worker OAuth surface
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test --test-name-pattern="oauth metadata" test/worker.test.js
      - name: Test Worker HTTP and MCP surface
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: node --test test/worker.test.js
      - name: Run Worker tests
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: npm test
      - name: Run quant core tests
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: python -m pytest
      - name: Validate Worker configuration
        if: steps.validation_evidence.outputs.reuse != 'true'
        run: npm run check
      - name: Compute exact material parity fingerprint
        id: material_parity
        shell: bash
        run: |
          set -euo pipefail
          test -s parity/material-manifest-v1.txt
          LC_ALL=C sort -c parity/material-manifest-v1.txt
          if [ -n "$(LC_ALL=C sort parity/material-manifest-v1.txt | uniq -d)" ]; then
            echo "duplicate material parity path"
            exit 41
          fi
          : > /tmp/quant-material-identities.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            git cat-file -e "HEAD:${path}"
            blob="$(git rev-parse "HEAD:${path}")"
            printf '%s=%s\n' "$path" "$blob" >> /tmp/quant-material-identities.txt
          done < parity/material-manifest-v1.txt
          LC_ALL=C sort -o /tmp/quant-material-identities.txt /tmp/quant-material-identities.txt
          sha256sum /tmp/quant-material-identities.txt | awk '{print $1}' > /tmp/quant-material-fingerprint
          fingerprint="$(cat /tmp/quant-material-fingerprint)"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"
          echo "Quant Lab material fingerprint: ${fingerprint}"

      - name: Require current M-BRAIN parity
        id: brain_parity
        shell: bash
        env:
          BROKER_URL: https://m-brain-parity-broker.briangriffin355.workers.dev
          DOMAIN: quant-lab
          CANONICAL_PATH: /M-BRAIN/PROJECTS/QUANT_LAB/01_STATE.md
        run: |
          set -euo pipefail
          LIVE_FINGERPRINT="$(cat /tmp/quant-material-fingerprint)"
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -X POST "$BROKER_URL/issue" -H 'content-type: application/json' --data "$(jq -nc --arg domain "$DOMAIN" --arg path "$CANONICAL_PATH" --arg fp "$LIVE_FINGERPRINT" '{domain:$domain,canonical_path:$path,live_fingerprint:$fp}')")"
          if [ "$code" != "200" ]; then
            echo "PARITY_BLOCKED"
            cat "$body"
            exit 42
          fi
          RECEIPT="$(jq -r '.receipt' "$body")" DOMAIN="$DOMAIN" CANONICAL_PATH="$CANONICAL_PATH" LIVE_FINGERPRINT="$LIVE_FINGERPRINT" node --input-type=module <<'NODE'
          import { createPublicKey, verify } from 'node:crypto';
          const publicKeyPem = `-----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEyx0NTCLqHmzGYakkuwDkH5Xd+ccw
          hJdPbgdPzSlmVrD8uGgTIYYFotcMVUo6nBFHGyYp3ZxMUmS/3jJGGyXVxQ==
          -----END PUBLIC KEY-----`.replace(/^          /gm, '');
          const [header64, payload64, signature64] = process.env.RECEIPT.split('.');
          if (!header64 || !payload64 || !signature64) throw new Error('brain_parity_receipt_malformed');
          const decode = (value) => JSON.parse(Buffer.from(value, 'base64url').toString('utf8'));
          const header = decode(header64);
          const payload = decode(payload64);
          const signature = Buffer.from(signature64, 'base64url');
          const valid = verify('sha256', Buffer.from(`${header64}.${payload64}`), { key: createPublicKey(publicKeyPem), dsaEncoding: 'ieee-p1363' }, signature);
          if (!valid) throw new Error('brain_parity_receipt_signature_invalid');
          if (header.alg !== 'ES256' || header.kid !== 'mbrain-parity-p256-v1') throw new Error('brain_parity_receipt_signing_identity_invalid');
          if (payload.iss !== 'm-brain-parity-broker' || payload.aud !== 'brain-parity-close') throw new Error('brain_parity_receipt_authority_invalid');
          if (!payload.exp || payload.exp <= Math.floor(Date.now() / 1000)) throw new Error('brain_parity_receipt_expired');
          if (payload.domain !== process.env.DOMAIN || payload.canonical_path !== process.env.CANONICAL_PATH || payload.live_fingerprint !== process.env.LIVE_FINGERPRINT) throw new Error('brain_parity_receipt_identity_mismatch');
          console.log('brain_parity_verified');
          NODE

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply quant_lab_operator --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        if: ${{ inputs.mode == 'deploy' }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_SHA: ${{ inputs.deploy_sha }}
          REPOSITORY_SHA: ${{ inputs.deploy_sha }}
          CURRENT_PHASE: autonomous-steady-state
      - name: Verify production console and canonical branding
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const baseUrl = "https://quant-lab-operator.briangriffin355.workers.dev";
          const requiredHomeMarkers = [
            "/quant-lab-logo.png",
            "/site.webmanifest",
            'property="og:image"',
            'name="twitter:card" content="summary"',
          ];
          const requiredAssets = [
            "favicon.ico",
            "favicon-16x16.png",
            "favicon-32x32.png",
            "apple-touch-icon.png",
            "android-chrome-192x192.png",
            "android-chrome-512x512.png",
            "quant-lab-logo.png",
            "og-image.png",
          ];

          async function fetchWithRetry(path, attempts = 12) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(`${baseUrl}${path}`, { redirect: "follow" });
                if (response.ok) return response;
                lastError = new Error(`${path} returned HTTP ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              if (attempt < attempts) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw lastError || new Error(`${path} unavailable`);
          }

          const home = await (await fetchWithRetry("/")).text();
          for (const marker of requiredHomeMarkers) {
            if (!home.includes(marker)) throw new Error(`Production home missing marker: ${marker}`);
          }
          console.log("Production home branding markers passed");

          const manifest = await (await fetchWithRetry("/site.webmanifest")).json();
          if (manifest.name !== "Quant Lab") throw new Error("Manifest name mismatch");
          const iconSizes = new Set((manifest.icons || []).map((icon) => icon.sizes));
          if (!iconSizes.has("192x192") || !iconSizes.has("512x512")) {
            throw new Error("Manifest icon sizes incomplete");
          }
          console.log("Production manifest passed");

          for (const asset of requiredAssets) {
            const response = await fetchWithRetry(`/${asset}`);
            const bytes = new Uint8Array(await response.arrayBuffer());
            if (bytes.byteLength < 100) throw new Error(`${asset} response is unexpectedly small`);
          }
          console.log("Production brand assets passed");

          const status = await (await fetchWithRetry("/api/public/status")).json();
          if (status.ok !== true || status.workerStatus !== "online") {
            throw new Error(`Public status unhealthy: ${JSON.stringify({ ok: status.ok, workerStatus: status.workerStatus })}`);
          }
          console.log("Production public status passed");
          console.log("Production branding smoke verification passed");
          NODE

      - name: Dispatch independent exact-SHA Recovery deployment
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%s)"
          gh workflow run quant-lab-recovery-deploy.yml --ref main -f deploy_sha="${RELEASE_SHA}"
          recovery_run_id=""
          for attempt in $(seq 1 20); do
            recovery_run_id="$(gh api "repos/${{ github.repository }}/actions/workflows/quant-lab-recovery-deploy.yml/runs?event=workflow_dispatch&per_page=20" --jq ".workflow_runs | map(select(.head_sha == \"${RELEASE_SHA}\" and ((.created_at | fromdateiso8601) >= ${started_at} - 5))) | sort_by(.id) | last | .id // empty")"
            if [[ -n "${recovery_run_id}" ]]; then
              break
            fi
            sleep 1
          done
          if [[ -z "${recovery_run_id}" ]]; then
            echo "Recovery dispatch side effect could not be reconciled." >&2
            exit 1
          fi
          echo "Recovery workflow dispatched for exact SHA ${RELEASE_SHA}: run ${recovery_run_id}"
