name: Quant Lab Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact commit SHA to validate and deploy
        required: true
        type: string
      mode:
        description: Apply migrations only or deploy after migrations
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - migrations

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact SHA input
        shell: bash
        run: |
          if [[ ! "${{ inputs.deploy_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "deploy_sha must be a 40-character commit SHA"
            exit 1
          fi
          if [[ "${{ inputs.mode }}" != "deploy" && "${{ inputs.mode }}" != "migrations" ]]; then
            echo "mode must be deploy or migrations"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Worker tests
        run: npm test
      - name: Run quant core tests
        run: python -m pytest
      - name: Validate Worker configuration
        run: npm run check
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply quant_lab_operator --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        if: ${{ inputs.mode == 'deploy' }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_SHA: ${{ inputs.deploy_sha }}
          REPOSITORY_SHA: ${{ inputs.deploy_sha }}
          CURRENT_PHASE: stage-6-champion-challenger-selection
