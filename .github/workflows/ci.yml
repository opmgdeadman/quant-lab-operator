name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: invocation-completes
            pattern: operator mcp status invocation completes
          - group: invocation-rejects
            pattern: operator mcp status invocation rejects
          - group: rejection-json
            pattern: operator mcp status rejection is JSON parse
          - group: rejection-serialization
            pattern: operator mcp status rejection is serialization
          - group: rejection-response
            pattern: operator mcp status rejection is response construction
    name: worker-tests (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Classify ${{ matrix.group }}
        run: node --test --test-name-pattern="${{ matrix.pattern }}" test/worker.test.js

  quant-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run quant core tests
        run: python -m pytest

  wrangler-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate Wrangler config
        run: npm run check
