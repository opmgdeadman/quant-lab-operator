name: Quant Lab CI
run-name: Quant Lab CI · ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quant-lab-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Worker tests
        run: npm test
      - name: Run quant core tests
        run: python -m pytest
      - name: Validate Wrangler config
        run: npm run check
