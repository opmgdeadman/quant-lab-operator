name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: worker-public-console
            files: test/worker.test.js
            pattern: internal status|home renders|canonical Quant|public live|professional console|legacy public
          - group: worker-mcp
            files: test/worker.test.js
            pattern: operator mcp|operator intents|execute_quant_lab_intent
          - group: worker-engineering
            files: test/worker.test.js
            pattern: read_repo_file|forbidden public|run_validation|production market|validate_production_sha|list_github_actions|engineering access|repo file list|apply_repo_patch|create_repo_file|inspect_repository|GitHub Actions
          - group: worker-oauth
            files: test/worker.test.js
            pattern: oauth
          - group: directional-shadow
            files: test/directional-shadow.test.js
          - group: historical-bootstrap
            files: test/historical-bootstrap.test.js
          - group: operator
            files: test/operator-capability-directory.test.js test/operator-client-safety.test.js
          - group: market-paper
            files: test/market-data.test.js test/paper-ledger.test.js
          - group: historical-research
            files: test/baseline-bench.test.js test/hostile-judge.test.js test/strategy-factory.test.js test/champion-selection.test.js
          - group: forward-qualification
            files: test/forward-paper.test.js test/live-qualification.test.js test/rolling-research.test.js
    name: worker-tests (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ${{ matrix.group }} tests
        if: ${{ matrix.pattern == '' }}
        run: node --test ${{ matrix.files }}
      - name: Run ${{ matrix.group }} patterned tests
        if: ${{ matrix.pattern != '' }}
        run: node --test --test-name-pattern="${{ matrix.pattern }}" ${{ matrix.files }}

  quant-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run quant core tests
        run: python -m pytest

  wrangler-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate Wrangler config
        run: npm run check
